<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E2E52"/>
      <stop offset="1" stop-color="#081B30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D98A"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- curved (pre-treatment) spine path, teal, left side -->
  <path d="M196 96 C 150 150, 236 190, 206 240 C 176 290, 262 320, 232 370" fill="none" stroke="#37A8A6" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  <!-- vertebrae dots on curved line -->
  <g fill="#37A8A6" opacity="0.55">
    <circle cx="196" cy="96" r="10"/>
    <circle cx="222" cy="145" r="10"/>
    <circle cx="206" cy="195" r="10"/>
    <circle cx="192" cy="240" r="10"/>
    <circle cx="214" cy="288" r="10"/>
    <circle cx="232" cy="330" r="10"/>
    <circle cx="232" cy="370" r="10"/>
  </g>
  <!-- straight (corrected) spine, gold, right side, overlapping -->
  <line x1="306" y1="96" x2="306" y2="416" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <g fill="url(#gold)">
    <circle cx="306" cy="96" r="13"/>
    <circle cx="306" cy="150" r="13"/>
    <circle cx="306" cy="204" r="13"/>
    <circle cx="306" cy="258" r="13"/>
    <circle cx="306" cy="312" r="13"/>
    <circle cx="306" cy="366" r="13"/>
    <circle cx="306" cy="416" r="13"/>
  </g>
  <!-- correction arrow -->
  <path d="M236 256 C 258 240, 272 240, 290 248" fill="none" stroke="#F4F8FB" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M282 240 L 292 248 L 280 256" fill="none" stroke="#F4F8FB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
